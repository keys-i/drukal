[package]
name = "koelu"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Checked coding changes, dependency reviews, and local-first agent workflows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/keys-i/koelu"
keywords = ["coding-agent", "dependabot", "dependency-review", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/.github/*.md",
    "/.github/workflows/**",
    "/docs/**",
    "/assets/**",
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tools/config/*.json",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
latex2mathml = "0.2"
nix = { version = "0.30", features = ["fs", "process", "signal"] }
pulldown-cmark = "0.13"
regex = "1.11"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
toml = "1.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "koelu"
path = "src/main.rs"
