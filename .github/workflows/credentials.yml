name: Credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  github:
    if: github.repository == 'keys-i/drukal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Create read-only App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DRUKAL_APP_CLIENT_ID || vars.KOELU_APP_CLIENT_ID }}
          private-key: ${{ secrets.DRUKAL_APP_PRIVATE_KEY || secrets.KOELU_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Verify App repository access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.toml" --silent
  providers:
    if: github.repository == 'keys-i/drukal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check provider credentials
        env:
          GEMINI: ${{ secrets.DRUKAL_GEMINI_API_KEY || secrets.KOELU_GEMINI_API_KEY }}
          GROQ: ${{ secrets.DRUKAL_GROQ_API_KEY || secrets.KOELU_GROQ_API_KEY }}
          CEREBRAS: ${{ secrets.DRUKAL_CEREBRAS_API_KEY || secrets.KOELU_CEREBRAS_API_KEY || secrets.RADY_CEREBRAS_API_KEY }}
          OPENROUTER: ${{ secrets.DRUKAL_OPENROUTER_API_KEY || secrets.KOELU_OPENROUTER_API_KEY }}
          CLOUDFLARE: ${{ secrets.DRUKAL_CLOUDFLARE_API_TOKEN || secrets.KOELU_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT: ${{ vars.DRUKAL_CLOUDFLARE_ACCOUNT_ID }}
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import re
          import sys

          def check(host, path, key, header="Authorization"):
              if not key:
                  return "missing"
              if any(ord(char) < 33 or ord(char) > 126 for char in key):
                  return "invalid key format"
              connection = http.client.HTTPSConnection(host, timeout=15)
              try:
                  value = key if header == "x-goog-api-key" else f"Bearer {key}"
                  connection.request("GET", path, headers={header: value, "Accept": "application/json"})
                  response = connection.getresponse()
                  if response.status != 200:
                      return f"HTTP {response.status}"
                  body = response.read(1_048_577)
                  if len(body) > 1_048_576:
                      return "response too large"
                  payload = json.loads(body)
                  if not isinstance(payload, dict) or payload.get("error"):
                      return "invalid response"
                  if host == "api.cloudflare.com":
                      result = payload.get("result")
                      if not isinstance(result, dict):
                          return "invalid response"
                      if payload.get("success") is not True or result.get("status") != "active":
                          return "inactive token"
                  return "valid"
              except (OSError, http.client.HTTPException):
                  return "network error"
              except (ValueError, UnicodeError):
                  return "invalid response"
              finally:
                  connection.close()

          if __name__ == "__main__":
              failed = False
              for name, host, path, header in [
                  ("GEMINI", "generativelanguage.googleapis.com", "/v1beta/models?pageSize=1", "x-goog-api-key"),
                  ("GROQ", "api.groq.com", "/openai/v1/models", "Authorization"),
                  ("CEREBRAS", "api.cerebras.ai", "/v1/models", "Authorization"),
                  ("OPENROUTER", "openrouter.ai", "/api/v1/key", "Authorization"),
                  ("CLOUDFLARE", "api.cloudflare.com", "/client/v4/user/tokens/verify", "Authorization"),
              ]:
                  status = check(host, path, os.environ.get(name, ""), header)
                  print(f"{name}: {status}")
                  failed |= status != "valid"
              account = bool(re.fullmatch(r"[a-fA-F0-9]{32}", os.environ.get("CLOUDFLARE_ACCOUNT", "")))
              print("Cloudflare account variable: " + ("configured" if account else "missing or invalid"))
              cargo = bool(os.environ.get("CARGO_TOKEN"))
              print("Cargo publication token: " + ("configured; publication scope not checked" if cargo else "missing"))
              sys.exit(int(failed or not account or not cargo))
          PY
