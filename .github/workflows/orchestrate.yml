name: Koelu orchestration

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [Checks, Security]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && format('koelu-mention-{0}', github.event.issue.number) || github.event_name == 'pull_request_review_comment' && format('koelu-mention-{0}', github.event.pull_request.number) || github.event_name == 'pull_request_target' && format('koelu-pr-{0}', github.event.pull_request.number) || 'koelu-central-orchestration' }}
  cancel-in-progress: false

jobs:
  mentions:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'issue_comment' ||
      (github.event_name == 'pull_request_review_comment' &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      contains(github.event.comment.body, '@koelu[bot]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve trusted service revision for an inline comment
        if: github.event_name == 'pull_request_review_comment'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out central Koelu service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Restore trusted Koelu binary
        id: binary
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/release/koelu
          key: koelu-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.sha || github.sha }}
      - name: Build trusted Koelu
        if: steps.binary.outputs.cache-hit != 'true'
        run: cargo build --release --locked --bin koelu
      - name: Install the pinned hosted editing harness
        if: >-
          (github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
          github.event.repository.private == true ||
          vars.KOELU_MODEL != '' ||
          contains(github.event.comment.body, 'approve')
        run: npm install --global --ignore-scripts --no-audit --no-fund @google/gemini-cli@0.61.0
      - name: Answer and deliver consented Koelu requests
        env:
          KOELU_APP_CLIENT_ID: ${{ vars.KOELU_APP_CLIENT_ID }}
          KOELU_APP_PRIVATE_KEY: ${{ secrets.KOELU_APP_PRIVATE_KEY }}
          KOELU_APP_SLUG: ${{ vars.KOELU_APP_SLUG }}
          KOELU_GEMINI_API_KEY: ${{ secrets.KOELU_GEMINI_API_KEY }}
          KOELU_CEREBRAS_API_KEY: ${{ secrets.KOELU_CEREBRAS_API_KEY }}
          KOELU_XAI_API_KEY: ${{ secrets.KOELU_XAI_API_KEY }}
          KOELU_GROQ_API_KEY: ${{ secrets.KOELU_GROQ_API_KEY }}
          KOELU_CLOUDFLARE_API_TOKEN: ${{ secrets.KOELU_CLOUDFLARE_API_TOKEN }}
          KOELU_CLOUDFLARE_ACCOUNT_ID: ${{ vars.KOELU_CLOUDFLARE_ACCOUNT_ID }}
          KOELU_OPENROUTER_API_KEY: ${{ secrets.KOELU_OPENROUTER_API_KEY }}
          KOELU_GEMINI_PRIVATE_OK: ${{ vars.KOELU_GEMINI_PRIVATE_OK || 'false' }}
          KOELU_CEREBRAS_PRIVATE_OK: ${{ vars.KOELU_CEREBRAS_PRIVATE_OK || 'false' }}
          KOELU_XAI_PRIVATE_OK: ${{ vars.KOELU_XAI_PRIVATE_OK || 'false' }}
          KOELU_GROQ_PRIVATE_OK: ${{ vars.KOELU_GROQ_PRIVATE_OK || 'false' }}
          KOELU_CLOUDFLARE_PRIVATE_OK: ${{ vars.KOELU_CLOUDFLARE_PRIVATE_OK || 'false' }}
          KOELU_OPENROUTER_PRIVATE_OK: ${{ vars.KOELU_OPENROUTER_PRIVATE_OK || 'false' }}
          KOELU_MODEL: ${{ vars.KOELU_MODEL || '' }}
          KOELU_MODEL_CHOICES: ${{ vars.KOELU_MODEL_CHOICES || '' }}
          KOELU_HARNESS: command
          KOELU_AGENT_COMMAND: bash ${{ github.workspace }}/.github/workflows/scripts/gemini.sh
          KOELU_REVIEW_COMMAND: bash ${{ github.workspace }}/.github/workflows/scripts/gemini.sh
          KOELU_COMMAND_ALLOW_GEMINI: '1'
          KOELU_HOSTED_ANSWERS: 'true'
          KOELU_EVENT_ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
          KOELU_EVENT_COMMENT: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'GitHub run number is invalid' >&2
            exit 1
          }
          export KOELU_INSTALLATION_SEED="$GITHUB_RUN_NUMBER"
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            target/release/koelu agent serve --once \
              --repo "$GITHUB_REPOSITORY" --issue "$KOELU_EVENT_ISSUE" --comment "$KOELU_EVENT_COMMENT"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request_review_comment ]]; then
            target/release/koelu agent serve --once --review-comment \
              --repo "$GITHUB_REPOSITORY" --issue "$KOELU_EVENT_ISSUE" --comment "$KOELU_EVENT_COMMENT"
          else
            target/release/koelu agent serve --once
          fi

  targets:
    if: >-
      ((github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment') ||
      (contains(github.event.comment.body, '@koelu[bot]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'pull_request_review_comment' &&
      github.event.pull_request.head.repo.full_name == github.repository)))) &&
      (github.event_name != 'pull_request_target' ||
      github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.pull_requests[0].number > 0)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has-targets: ${{ steps.targets.outputs.has-targets }}
    steps:
      - name: Resolve trusted service revision for a PR review mention
        if: github.event_name == 'pull_request_review_comment'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out central Koelu service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Restore trusted Koelu binary
        id: binary
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/release/koelu
          key: koelu-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.sha || github.sha }}
      - name: Build trusted Koelu
        if: steps.binary.outputs.cache-hit != 'true'
        run: cargo build --release --locked --bin koelu
      - name: Find consented pull requests
        id: targets
        env:
          KOELU_APP_CLIENT_ID: ${{ vars.KOELU_APP_CLIENT_ID }}
          KOELU_APP_PRIVATE_KEY: ${{ secrets.KOELU_APP_PRIVATE_KEY }}
          KOELU_APP_SLUG: ${{ vars.KOELU_APP_SLUG }}
          KOELU_EVENT_PR: ${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'GitHub run number is invalid' >&2
            exit 1
          }
          export KOELU_INSTALLATION_SEED="$GITHUB_RUN_NUMBER"
          export KOELU_TARGET_SEED="$GITHUB_RUN_NUMBER"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && ! "$KOELU_EVENT_PR" =~ ^[1-9][0-9]*$ ]]; then
            matrix='{"include":[]}'
          elif [[ "$GITHUB_EVENT_NAME" == pull_request_target || "$GITHUB_EVENT_NAME" == workflow_run || "$GITHUB_EVENT_NAME" == issue_comment || "$GITHUB_EVENT_NAME" == pull_request_review_comment ]]; then
            [[ "$KOELU_EVENT_PR" =~ ^[1-9][0-9]*$ ]] || exit 1
            matrix=$(target/release/koelu agent targets --max-reviews 1 \
              --repo "$GITHUB_REPOSITORY" --pr "$KOELU_EVENT_PR")
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            matrix=$(target/release/koelu agent targets --max-reviews 10 \
              --repo "$GITHUB_REPOSITORY")
          else
            matrix=$(target/release/koelu agent targets --max-reviews 4)
          fi
          jq -e '.include | type == "array" and length <= 10' <<<"$matrix" > /dev/null
          echo "matrix=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"
          if [[ $(jq '.include | length' <<<"$matrix") == 0 ]]; then
            echo 'has-targets=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has-targets=true' >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: [targets, mentions]
    if: always() && needs.targets.outputs.has-targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    uses: ./.github/workflows/solve.yml
    with:
      solver-ref: ${{ matrix.solver_ref }}
      autofix: ${{ matrix.autofix }}
      app-client-id: ${{ vars.KOELU_APP_CLIENT_ID }}
      repo: ${{ matrix.repo }}
      repo-owner: ${{ matrix.owner }}
      repo-name: ${{ matrix.name }}
      repository-private: ${{ matrix.private }}
      required-checks: ${{ toJSON(matrix.checks) }}
      model: ${{ vars.KOELU_MODEL || '' }}
      model-choices: ${{ vars.KOELU_MODEL_CHOICES || '' }}
      cloudflare-account-id: ${{ vars.KOELU_CLOUDFLARE_ACCOUNT_ID || '' }}
      gemini-private-ok: ${{ vars.KOELU_GEMINI_PRIVATE_OK == 'true' }}
      cerebras-private-ok: ${{ vars.KOELU_CEREBRAS_PRIVATE_OK == 'true' }}
      xai-private-ok: ${{ vars.KOELU_XAI_PRIVATE_OK == 'true' }}
      groq-private-ok: ${{ vars.KOELU_GROQ_PRIVATE_OK == 'true' }}
      cloudflare-private-ok: ${{ vars.KOELU_CLOUDFLARE_PRIVATE_OK == 'true' }}
      openrouter-private-ok: ${{ vars.KOELU_OPENROUTER_PRIVATE_OK == 'true' }}
      harness: ${{ vars.KOELU_HARNESS || 'codex' }}
      pr-number: ${{ matrix.number }}
    secrets:
      app-private-key: ${{ secrets.KOELU_APP_PRIVATE_KEY }}
      gemini-api-key: ${{ secrets.KOELU_GEMINI_API_KEY }}
      cerebras-api-key: ${{ secrets.KOELU_CEREBRAS_API_KEY }}
      xai-api-key: ${{ secrets.KOELU_XAI_API_KEY }}
      groq-api-key: ${{ secrets.KOELU_GROQ_API_KEY }}
      cloudflare-api-token: ${{ secrets.KOELU_CLOUDFLARE_API_TOKEN }}
      openrouter-api-key: ${{ secrets.KOELU_OPENROUTER_API_KEY }}
